 {t:"logs",q:["Un entorno self-managed tiene picos de lentitud en procesos que escriben en un data store. Quieres ver solo las operaciones de base de datos lentas. ¿Qué log revisas?","A self-managed environment has slowdowns in processes that write to a data store. You want to see only the slow database operations. Which log do you check?"],
  o:[["perf_monitor_rdbms_slow.csv, que duplica las operaciones de más de 3 segundos (umbral ajustable con conf.monitoring.rdbms.SLOW_QUERY_THRESHOLD_MS)","login-audit.csv, que registra la duración de cada sesión","design_object_diffs_details, que mide las comparaciones de objetos","engine_summary.csv, que lista cada consulta SQL"],["perf_monitor_rdbms_slow.csv, which duplicates operations over 3 seconds (threshold adjustable with conf.monitoring.rdbms.SLOW_QUERY_THRESHOLD_MS)","login-audit.csv, which records each session's duration","design_object_diffs_details, which measures object comparisons","engine_summary.csv, which lists every SQL query"]],a:0,

const TARGET_BLOCKS = 30;   // tamaño objetivo de la serie; el examen final exige superarlos todos
const EXAM = { size:50, minutes:60, pass:0.6 };

/* ============ ALMACENAMIENTO LOCAL Y COOKIES ============ */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem("apq."+k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("apq."+k, JSON.stringify(v)); }catch(e){} }
};
function getCookie(n){ const m = document.cookie.match(new RegExp("(?:^|; )"+n+"=([^;]*)")); return m ? decodeURIComponent(m[1]) : null; }
function setCookie(n, v){ document.cookie = n+"="+encodeURIComponent(v)+"; Max-Age=63072000; Path=/; SameSite=Lax"+(location.protocol==="https:"?"; Secure":""); }
let uid = getCookie("apq_uid") || LS.get("uid", null);
if(!uid || !/^[A-Za-z0-9-]{8,64}$/.test(uid)){
  uid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(16)+"-"+Math.random().toString(16).slice(2,14));
}
setCookie("apq_uid", uid); LS.set("uid", uid);
const state = { alias: getCookie("apq_alias") || LS.get("alias",""), best: LS.get("best",{}), examBest: LS.get("examBest",null), lang: LS.get("lang","es"), view:"home" };
function saveAlias(v){ state.alias = v; LS.set("alias", v); setCookie("apq_alias", v); }
if(state.alias) saveAlias(state.alias);
let startDay = getCookie("apq_start") || LS.get("start", null);
if(!/^\d{4}-\d{2}-\d{2}$/.test(startDay||"")) startDay = localISO();
setCookie("apq_start", startDay); LS.set("start", startDay);

/* ============ DESBLOQUEO Y PUBLICACIÓN DIARIA ============ */
function localISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ const [y,m,d]=iso.split("-"); return d+"/"+m; }
const START_BLOCKS = 4;   // bloques activos el primer día; después se activa uno más cada día
function dayDiff(a, b){ const [y1,m1,d1]=a.split("-").map(Number), [y2,m2,d2]=b.split("-").map(Number); return Math.round((Date.UTC(y2,m2-1,d2)-Date.UTC(y1,m1-1,d1))/86400000); }
const userWindow = () => START_BLOCKS + Math.max(0, dayDiff(startDay, localISO()));
function unlockISO(i){ const [y,m,d]=startDay.split("-").map(Number); return new Date(Date.UTC(y,m-1,d+Math.max(0,i-START_BLOCKS+1))).toISOString().slice(0,10); }
const released = (b, i) => i < userWindow() && (!b.releaseOn || b.releaseOn <= localISO());
const passed = b => state.best[b.id]!=null && state.best[b.id]/b.qs.length >= 0.6;
function status(i){
  const b = BLOCKS[i];
  if(!released(b,i)) return "soon";
  if(passed(b)) return "passed";
  if(i===0 || passed(BLOCKS[i-1])) return "open";
  return "locked";
}
const canPlay = i => { const s = status(i); return s==="open" || s==="passed"; };
const passedCount = () => BLOCKS.filter((b,i)=>released(b,i) && passed(b)).length;
const examUnlocked = () => BLOCKS.length >= TARGET_BLOCKS && BLOCKS.every((b,i)=>released(b,i) && passed(b));

/* ============ RANKING (servidor en Vercel) ============ */
const shared = { rows:null, status:"idle" };
async function loadRanking(){
  shared.status = shared.rows ? "on" : "loading";
  if(state.view==="rank") render();
  try{
    const r = await fetch("/api/ranking", { cache:"no-store", credentials:"same-origin" });
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    shared.rows = Array.isArray(j.rows) ? j.rows : [];
    shared.status = "on";
  }catch(e){ shared.status = "off"; }
  if(state.view==="rank") render();
}
async function pushScore(){
  if(!state.alias) return;
  try{
    await fetch("/api/ranking", { method:"POST", credentials:"same-origin", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ uid, alias: state.alias, best: state.best, exam: state.examBest }) });
  }catch(e){}
}

/* ============ UTILIDADES ============ */
const $ = s => document.querySelector(s);
const L = () => state.lang==="en" ? 1 : 0;
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(v===false || v==null) continue;
    if(k==="class") n.className=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else n.setAttribute(k, v===true ? "" : v);
  }
  for(const k of kids){ if(k==null) continue; n.append(k.nodeType ? k : document.createTextNode(k)); }
  return n;
}
function setLang(l){
  state.lang=l; LS.set("lang",l);
  $("#lang-es").setAttribute("aria-pressed", l==="es"); $("#lang-en").setAttribute("aria-pressed", l==="en");
  if(quiz && state.view==="quiz"){ quiz.qLang = l; rerenderQuiz(); } else render();
}
$("#lang-es").onclick=()=>setLang("es"); $("#lang-en").onclick=()=>setLang("en");
$("#lang-es").setAttribute("aria-pressed", state.lang==="es"); $("#lang-en").setAttribute("aria-pressed", state.lang==="en");
$("#tab-blocks").onclick=()=>{ state.view="home"; render(); };
$("#tab-list").onclick=()=>{ state.view="list"; render(); };
$("#tab-rank").onclick=()=>{ state.view="rank"; render(); loadRanking(); };

function statusText(i){
  const s = status(i), b = BLOCKS[i];
  if(s==="passed") return "Superado";
  if(s==="open") return state.best[b.id]!=null ? "Pendiente de superar" : "Disponible";
  if(s==="locked") return `Bloqueado: supera el bloque ${i}`;
  return `Se activa el ${fmtDate(i < userWindow() && b.releaseOn ? b.releaseOn : unlockISO(i))}`;
}

/* ============ PANTALLAS ============ */
function render(){
  const app = $("#app"); app.innerHTML="";
  $("#hello").textContent = state.alias ? "Hola, "+state.alias : "Preparación ACD201";
  $("#tabs").classList.toggle("hidden", !state.alias || state.view==="quiz" || state.view==="result" || state.view==="examResult");
  $("#tab-blocks").setAttribute("aria-current", state.view==="home" ? "page" : "false");
  $("#tab-list").setAttribute("aria-current", state.view==="list" ? "page" : "false");
  $("#tab-rank").setAttribute("aria-current", state.view==="rank" ? "page" : "false");
  if(!state.alias) return renderWelcome(app);
  if(state.view==="rank") return renderRank(app);
  if(state.view==="list") return renderList(app);
  if(state.view==="result") return renderResult(app);
  if(state.view==="examResult") return renderExamResult(app);
  return renderHome(app);
}

function renderWelcome(app){
  const input = el("input",{id:"alias",type:"text",maxlength:"24",autocomplete:"nickname",placeholder:"Por ejemplo, Marta_dev"});
  const err = el("p",{class:"err",role:"alert"});
  const go = ()=>{
    const v = input.value.trim();
    if(v.length<2){ err.textContent="Escribe un nombre de al menos 2 caracteres."; input.focus(); return; }
    saveAlias(v.slice(0,24)); state.view="home"; render(); pushScore();
  };
  input.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  app.append(
    el("h1",{},"Practica para la certificación Senior Developer de Appian"),
    el("p",{class:"lead"},"Bloques de preguntas tipo test basados en la documentación oficial de Appian y en Appian Community. Empiezas con 4 bloques activos y cada día se activa uno nuevo. Mantén pulsada una pregunta para verla en inglés."),
    el("div",{class:"field"}, el("label",{for:"alias"},"¿Cómo quieres aparecer en el ranking?"), input),
    err,
    el("button",{class:"btn",type:"button",onclick:go},"Empezar"),
    el("p",{class:"hint",style:"margin-top:12px"},"Tu nombre se guarda en una cookie de este dispositivo para reconocerte en la próxima visita.")
  );
  setTimeout(()=>input.focus(),50);
}

function renderHome(app){
  const avail = BLOCKS.filter(released);
  const nPassed = avail.filter(passed).length;
  const cur = BLOCKS.findIndex((b,i)=>status(i)==="open");
  app.append(el("h1",{},"Tu ruta"), el("p",{class:"lead"}, `Has superado ${nPassed} de ${avail.length} bloques disponibles. Cada bloque se supera con un 60% y desbloquea el siguiente.`));
  if(cur>=0){
    const b = BLOCKS[cur];
    app.append(el("div",{class:"cur-card"},
      el("div",{class:"k"}, `Bloque ${cur+1}`),
      el("div",{class:"t"}, b.title[L()]),
      el("p",{}, state.best[b.id]!=null ? `Tu mejor nota: ${state.best[b.id]}/${b.qs.length}. Necesitas ${Math.ceil(b.qs.length*0.6)} aciertos.` : `${b.qs.length} preguntas. Necesitas ${Math.ceil(b.qs.length*0.6)} aciertos para superarlo.`),
      el("button",{class:"btn",type:"button",onclick:()=>startQuiz(cur)}, state.best[b.id]!=null ? `Volver a realizar el bloque ${cur+1}` : `Empezar el bloque ${cur+1}`)));
  } else {
    const nx = BLOCKS.findIndex((b,i)=>!released(b,i));
    app.append(el("div",{class:"note"}, nx>=0 ? `Has superado todos tus bloques activos. El siguiente se activa el ${fmtDate(unlockISO(nx))}.` : (BLOCKS.length<TARGET_BLOCKS ? "Has superado todos los bloques disponibles. Mañana se publica el siguiente." : "Has superado todos los bloques.")));
  }
  const ul = el("ul",{class:"blocks"});
  BLOCKS.forEach((b,i)=>{
    const s = status(i), best = state.best[b.id];
    const pct = best!=null ? Math.round(best/b.qs.length*100) : null;
    ul.append(el("li",{class: s==="passed"?"done":s},
      el("button",{type:"button",disabled:!canPlay(i),onclick:()=>startQuiz(i)},
        el("span",{class:"bnum","aria-hidden":"true"}, s==="locked"||s==="soon" ? "🔒" : String(i+1)),
        el("span",{}, el("div",{class:"btitle"}, s==="soon" ? `Bloque ${i+1}` : b.title[L()]), el("div",{class:"st "+s}, statusText(i))),
        el("span",{class:"bscore "+(pct==null?"":pct>=60?"pass":"fail")}, pct==null ? "" : `${best}/${b.qs.length}`)
      )));
  });
  if(BLOCKS.length<TARGET_BLOCKS) ul.append(el("li",{class:"soon"}, el("button",{type:"button",disabled:true}, el("span",{class:"bnum","aria-hidden":"true"},"🔒"), el("span",{}, el("div",{class:"btitle"},`Bloque ${BLOCKS.length+1}`), el("div",{class:"st soon"},"Se publica mañana")), el("span",{}))));
  app.append(ul);
  app.append(examCard());
  app.append(el("button",{class:"backlink",type:"button",style:"margin-top:20px",onclick:()=>{
    const v = prompt("Nuevo nombre para el ranking:", state.alias);
    if(v && v.trim().length>=2){ saveAlias(v.trim().slice(0,24)); render(); pushScore(); }
  }},"Cambiar mi nombre"));
}

function renderList(app){
  app.append(el("h1",{},"Todos los bloques"), el("p",{class:"lead"},"Puedes repetir cualquier bloque que ya hayas superado. Los siguientes se desbloquean al superar el anterior."));
  const box = el("div",{style:"border-top:1px solid var(--line)"});
  BLOCKS.forEach((b,i)=>{
    const s = status(i), best = state.best[b.id];
    const n = b.qs.length;
    const topics = [...new Set(b.qs.map(q=>T[q.t][L()]))].join(", ");
    let action;
    if(s==="passed") action = el("button",{class:"mini",type:"button",onclick:()=>startQuiz(i)},"Volver a realizar");
    else if(s==="open") action = el("button",{class:"mini pri",type:"button",onclick:()=>startQuiz(i)}, best!=null ? "Volver a realizar" : "Realizar");
    else action = el("button",{class:"mini",type:"button",disabled:true},"🔒");
    box.append(el("div",{class:"lrow"},
      el("div",{},
        el("div",{class:"btitle"}, `${i+1}. ` + (s==="soon" ? "Próximo bloque" : b.title[L()])),
        el("div",{class:"bmeta"}, s==="soon" ? "" : `${n} preguntas · ${topics}`),
        el("div",{class:"st "+s}, statusText(i) + (best!=null ? ` · mejor nota ${best}/${n}` : ""))),
      action));
  });
  if(BLOCKS.length<TARGET_BLOCKS) box.append(el("div",{class:"lrow"}, el("div",{}, el("div",{class:"btitle"},`${BLOCKS.length+1}. Próximo bloque`), el("div",{class:"st soon"},`Se publica mañana · serie de ${TARGET_BLOCKS} bloques`)), el("button",{class:"mini",type:"button",disabled:true},"🔒")));
  app.append(box);
  app.append(examCard());
}

/* ---- Test ---- */
let quiz = null;
function startQuiz(i){
  if(!canPlay(i)) return;
  const n = BLOCKS[i].qs.length, lastAll = LS.get("lastOrder",{}), prev = lastAll[BLOCKS[i].id];
  let order = perm(n), tries = 0;
  while(n>1 && prev && order.join(",")===prev && tries++<20) order = perm(n);
  lastAll[BLOCKS[i].id] = order.join(","); LS.set("lastOrder", lastAll);
  quiz = { bi:i, qi:0, sel:-1, checked:false, results:[], order, opts: order.map(()=>perm(4)), qLang: state.lang, from: state.view };
  state.view="quiz"; render(); renderQuestion(); window.scrollTo(0,0);
}
function renderQuestion(){
  const app = $("#app"); app.innerHTML="";
  const b = BLOCKS[quiz.bi], q = b.qs[quiz.order[quiz.qi]], l = quiz.qLang==="en"?1:0;

  const flow = el("div",{class:"flow","aria-hidden":"true"}, el("span",{class:"ev"}));
  b.qs.forEach((_,k)=>{
    flow.append(el("span",{class:"ln"+(k<=quiz.qi?" past":"")}));
    const r = quiz.results[k];
    flow.append(el("span",{class:"nd"+(k===quiz.qi&&!quiz.checked?" cur":"")+(r===true?" ok":r===false?" ko":"")}));
  });
  flow.append(el("span",{class:"ln"}), el("span",{class:"ev end"}));

  const card = el("section",{class:"qcard","aria-live":"polite"},
    el("div",{class:"qmeta"}, el("span",{class:"tag"}, T[q.t][l]), el("span",{}, `${quiz.qi+1} de ${b.qs.length}`)),
    el("p",{class:"qtext"}, q.q[l]),
    el("div",{class:"qlang"}, "Toca una respuesta para corregirla al instante. Mantén pulsada la pregunta para verla en ", el("b",{}, l?"español":"inglés"), ".")
  );
  const opts = el("div",{class:"opts",role:"radiogroup","aria-label":"Respuestas"});
  quiz.opts[quiz.qi].forEach((k,j)=>{ const txt = q.o[l][k];
    let cls = "opt";
    if(quiz.checked){ if(k===q.a) cls+=" ok"; else if(k===quiz.sel) cls+=" ko"; }
    opts.append(el("button",{type:"button",class:cls,role:"radio","aria-checked":String(k===quiz.sel),onclick:()=>{
      if(lp.fired){ lp.fired=false; return; }
      if(quiz.checked) return;
      quiz.sel=k; quiz.checked=true; quiz.results[quiz.qi] = k===q.a; renderQuestion();
      const f=document.querySelector(".fb"); if(f) f.scrollIntoView({block:"nearest",behavior:"smooth"});
    }}, el("span",{class:"k"}, String.fromCharCode(65+j)), el("span",{}, txt)));
  });
  card.append(opts);
  attachLongPress(card);

  let fb = null;
  if(quiz.checked){
    const ok = quiz.sel===q.a;
    fb = el("div",{class:"fb "+(ok?"ok":"ko"),role:"status"}, el("strong",{}, ok?(l?"Correct":"Correcto"):(l?"Incorrect. Right answer: ":"Incorrecto. La correcta es la ")+(ok?"":String.fromCharCode(65+quiz.opts[quiz.qi].indexOf(q.a)))), q.e[l], el("span",{class:"src"}, (l?"Source: ":"Fuente: ")+q.s));
  }
  const last = quiz.qi===b.qs.length-1;
  const main = !quiz.checked ? null : el("button",{class:"btn",type:"button",onclick:()=>{
    if(last){ finishQuiz(); return; }
    quiz.qi++; quiz.sel=-1; quiz.checked=false; quiz.qLang=state.lang; renderQuestion(); window.scrollTo(0,0);
  }}, last ? "Ver resultado" : "Siguiente pregunta");

  app.append(...[
    el("button",{class:"backlink",type:"button",onclick:()=>{ if(confirm("¿Salir del bloque? Se perderá el progreso de este intento.")){ state.view=quiz.from||"home"; quiz=null; render(); } }},"Salir del bloque"),
    flow, card, fb,
    main ? el("div",{class:"actions"}, main) : null
  ].filter(Boolean));
}

/* Pulsación larga: alterna español / inglés solo en la pregunta actual */
const lp = { timer:null, fired:false, x:0, y:0 };
function attachLongPress(node){
  node.addEventListener("contextmenu", e=>e.preventDefault());
  node.addEventListener("pointerdown", e=>{
    lp.fired=false; lp.x=e.clientX; lp.y=e.clientY;
    clearTimeout(lp.timer);
    lp.timer = setTimeout(()=>{
      lp.fired = true;
      quiz.qLang = quiz.qLang==="en" ? "es" : "en";
      if(navigator.vibrate) try{ navigator.vibrate(15); }catch(_){}
      rerenderQuiz();
      const c = document.querySelector(".qcard"); if(c) c.classList.add("flash");
    }, 550);
  });
  const cancel = ()=>clearTimeout(lp.timer);
  node.addEventListener("pointerup", cancel);
  node.addEventListener("pointercancel", cancel);
  node.addEventListener("pointerleave", cancel);
  node.addEventListener("pointermove", e=>{ if(Math.abs(e.clientX-lp.x)>10||Math.abs(e.clientY-lp.y)>10) cancel(); });
}

function finishQuiz(){
  const b = BLOCKS[quiz.bi];
  const score = quiz.results.filter(Boolean).length;
  quiz.score = score;
  const prev = state.best[b.id];
  if(prev==null || score>prev){ state.best[b.id]=score; LS.set("best",state.best); pushScore(); }
  state.view="result"; render(); window.scrollTo(0,0);
}
function renderResult(app){
  const b = BLOCKS[quiz.bi], l=L(), i = quiz.bi;
  const pct = Math.round(quiz.score/b.qs.length*100);
  const ok = pct>=60;
  const nextOpen = i < BLOCKS.length-1 && canPlay(i+1);
  app.append(
    el("p",{class:"hint"}, `Bloque ${i+1}: ${b.title[l]}`),
    el("div",{class:"big"}, `${quiz.score}/${b.qs.length}`),
    el("div",{class:"verdict "+(ok?"pass":"fail")}, ok ? `${pct}%: bloque superado` : `${pct}%: necesitas un 60% para superarlo`)
  );
  if(!ok && i < BLOCKS.length-1 && !passed(b)) app.append(el("p",{class:"hint"}, `El bloque ${i+2} se desbloquea cuando superes este.`));
  const fails = quiz.order.map((oi,k)=>({q:b.qs[oi],k})).filter(x=>quiz.results[x.k]===false);
  if(fails.length){
    app.append(el("h2",{},"Repasa los fallos"));
    const ul = el("ul",{class:"review"});
    fails.forEach(({q})=>ul.append(el("li",{}, q.q[l], el("br"), el("span",{class:"ans"}, q.o[l][q.a]))));
    app.append(ul);
  }
  app.append(
    el("div",{style:"display:grid;gap:10px;margin-top:24px"},
      el("button",{class: ok&&nextOpen ? "btn ghost" : "btn",type:"button",onclick:()=>startQuiz(i)},"Volver a realizar el bloque"),
      nextOpen ? el("button",{class:"btn",type:"button",onclick:()=>startQuiz(i+1)},`Ir al bloque ${i+2}`) : null,
      el("button",{class:"btn ghost",type:"button",onclick:()=>{ state.view="list"; render(); }},"Ver todos los bloques")
    )
  );
}

function renderRank(app){
  app.append(el("h1",{},"Ranking"), el("p",{class:"lead"},"Puntos = suma de tus mejores aciertos en cada bloque."));
  const myTotal = Object.values(state.best).reduce((s,v)=>s+v,0);
  if(shared.status==="loading" || shared.status==="idle"){ app.append(el("p",{class:"hint"},"Cargando ranking…")); return; }
  if(shared.status==="off"){
    app.append(el("div",{class:"note"},"No se ha podido cargar el ranking. Comprueba tu conexión y vuelve a abrir esta pestaña. Tus puntos están guardados en este dispositivo."));
    app.append(el("ul",{class:"rank"}, el("li",{class:"me"}, el("span",{class:"pos"},"–"), el("span",{}, state.alias, el("div",{class:"sub"}, `${Object.keys(state.best).length} bloques`)), el("span",{class:"pts"}, String(myTotal)))));
    return;
  }
  if(!shared.rows.length){ app.append(el("p",{class:"hint"},"Aún no hay nadie en el ranking. Completa un bloque para aparecer el primero.")); return; }
  const ul = el("ul",{class:"rank"});
  shared.rows.forEach((r,i)=>{
    ul.append(el("li",{class: r.me?"me":""},
      el("span",{class:"pos"}, String(i+1)),
      el("span",{}, String(r.alias||"Anónimo") + (r.me?" (tú)":""), el("div",{class:"sub"}, `${r.blocks||0} bloques` + (r.exam!=null ? ` · examen ${r.exam}/${EXAM.size}` : ""))),
      el("span",{class:"pts"}, String(r.total||0))));
  });
  app.append(ul);
}

/* ============ EXAMEN FINAL ============ */
function rerenderQuiz(){ (quiz && quiz.mode==="exam" ? renderExamQuestion : renderQuestion)(); }
function examCard(){
  const ok = examUnlocked();
  const done = passedCount();
  const card = el("div",{class:"exam-card"+(ok?" on":"")},
    el("div",{class:"k"}, "Examen final"),
    el("div",{class:"t"}, `${EXAM.size} preguntas al azar · ${EXAM.minutes} minutos`),
    el("p",{}, ok ? "Como el examen real: sin corrección hasta entregar y aprobado con un 60%." :
      `Se desbloquea al superar los ${TARGET_BLOCKS} bloques. Llevas ${done} de ${TARGET_BLOCKS}.`),
    state.examBest!=null ? el("p",{class:"st passed"}, `Tu mejor nota: ${state.examBest}/${EXAM.size}`) : null,
    el("button",{class:"btn",type:"button",disabled:!ok,onclick:startExam}, ok ? (state.examBest!=null ? "Repetir el examen final" : "Empezar el examen final") : "🔒 Bloqueado")
  );
  return card;
}
function rnd(n){ if(window.crypto && crypto.getRandomValues){ const u=new Uint32Array(1), lim=Math.floor(4294967296/n)*n; let x; do{ crypto.getRandomValues(u); x=u[0]; }while(x>=lim); return x%n; } return Math.floor(Math.random()*n); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function perm(n){ return shuffle([...Array(n).keys()]); }
let examTimer = null;
function startExam(){
  if(!examUnlocked()) return;
  const pool = [];
  BLOCKS.forEach((b,bi)=>b.qs.forEach((_,qi)=>pool.push({bi,qi})));
  const items = shuffle(pool).slice(0, EXAM.size);
  quiz = { mode:"exam", items, opts: items.map(()=>perm(4)), qi:0, answers:new Array(items.length).fill(-1), qLang: state.lang, from: state.view, deadline: Date.now()+EXAM.minutes*60000 };
  state.view="quiz"; render(); renderExamQuestion(); window.scrollTo(0,0);
  clearInterval(examTimer);
  examTimer = setInterval(()=>{
    const left = quiz && quiz.mode==="exam" ? quiz.deadline - Date.now() : 0;
    const t = document.getElementById("exam-timer");
    if(t) t.textContent = fmtLeft(left);
    if(left <= 0){ clearInterval(examTimer); finishExam(true); }
  }, 1000);
}
function fmtLeft(ms){ ms=Math.max(0,ms); const m=Math.floor(ms/60000), s=Math.floor(ms%60000/1000); return `${m}:${String(s).padStart(2,"0")}`; }
function renderExamQuestion(){
  const app = $("#app"); app.innerHTML="";
  const it = quiz.items[quiz.qi], b = BLOCKS[it.bi], q = b.qs[it.qi], l = quiz.qLang==="en"?1:0;
  const answered = quiz.answers.filter(a=>a>=0).length;
  const card = el("section",{class:"qcard"},
    el("div",{class:"qmeta"}, el("span",{class:"tag"}, T[q.t][l]), el("span",{}, `${quiz.qi+1} de ${quiz.items.length}`)),
    el("p",{class:"qtext"}, q.q[l]),
    el("div",{class:"qlang"}, "Elige una respuesta; puedes cambiarla hasta entregar. Mantén pulsada la pregunta para verla en ", el("b",{}, l?"español":"inglés"), ".")
  );
  const opts = el("div",{class:"opts",role:"radiogroup","aria-label":"Respuestas"});
  quiz.opts[quiz.qi].forEach((k,j)=>{ const txt = q.o[l][k];
    opts.append(el("button",{type:"button",class:"opt"+(quiz.answers[quiz.qi]===k?" sel":""),role:"radio","aria-checked":String(quiz.answers[quiz.qi]===k),onclick:()=>{
      if(lp.fired){ lp.fired=false; return; }
      quiz.answers[quiz.qi]=k; renderExamQuestion();
    }}, el("span",{class:"k"}, String.fromCharCode(65+j)), el("span",{}, txt)));
  });
  card.append(opts);
  attachLongPress(card);
  const last = quiz.qi===quiz.items.length-1;
  app.append(
    el("div",{class:"exam-top"},
      el("button",{class:"backlink",type:"button",onclick:()=>{ if(confirm("¿Salir del examen? Se perderá este intento.")){ clearInterval(examTimer); state.view=quiz.from||"home"; quiz=null; render(); } }},"Salir"),
      el("span",{class:"timer",id:"exam-timer","aria-label":"Tiempo restante"}, fmtLeft(quiz.deadline-Date.now()))),
    el("div",{class:"hint",style:"margin:4px 0 14px"}, `Respondidas: ${answered} de ${quiz.items.length}`),
    card,
    el("div",{class:"actions",style:"display:grid;grid-template-columns:1fr 1fr;gap:10px"},
      el("button",{class:"btn ghost",type:"button",disabled:quiz.qi===0,onclick:()=>{ quiz.qi--; quiz.qLang=state.lang; renderExamQuestion(); window.scrollTo(0,0); }},"Anterior"),
      last ? el("button",{class:"btn",type:"button",onclick:()=>{
          const pend = quiz.answers.filter(a=>a<0).length;
          if(pend && !confirm(`Te quedan ${pend} preguntas sin responder. ¿Entregar igualmente?`)) return;
          finishExam(false);
        }},"Entregar examen")
      : el("button",{class:"btn",type:"button",onclick:()=>{ quiz.qi++; quiz.qLang=state.lang; renderExamQuestion(); window.scrollTo(0,0); }},"Siguiente"))
  );
}
function finishExam(timeout){
  clearInterval(examTimer);
  if(!quiz || quiz.mode!=="exam") return;
  quiz.timeout = timeout;
  quiz.score = quiz.items.reduce((s,it,k)=> s + (quiz.answers[k]===BLOCKS[it.bi].qs[it.qi].a ? 1 : 0), 0);
  if(state.examBest==null || quiz.score>state.examBest){ state.examBest = quiz.score; LS.set("examBest", quiz.score); pushScore(); }
  state.view="examResult"; render(); window.scrollTo(0,0);
}
function renderExamResult(app){
  const l = L(), n = quiz.items.length, pct = Math.round(quiz.score/n*100), ok = quiz.score/n >= EXAM.pass;
  app.append(
    el("p",{class:"hint"}, quiz.timeout ? "Examen final · entregado al acabarse el tiempo" : "Examen final"),
    el("div",{class:"big"}, `${quiz.score}/${n}`),
    el("div",{class:"verdict "+(ok?"pass":"fail")}, ok ? `${pct}%: aprobado` : `${pct}%: por debajo del 60%`)
  );
  const byT = {};
  quiz.items.forEach((it,k)=>{ const q=BLOCKS[it.bi].qs[it.qi]; byT[q.t] = byT[q.t] || {ok:0,n:0}; byT[q.t].n++; if(quiz.answers[k]===q.a) byT[q.t].ok++; });
  app.append(el("h2",{},"Resultado por tema"));
  const ul = el("ul",{class:"rank"});
  Object.entries(byT).sort((a,b)=>a[1].ok/a[1].n - b[1].ok/b[1].n).forEach(([t,v])=>{
    const p = Math.round(v.ok/v.n*100);
    ul.append(el("li",{}, el("span",{class:"pos"}, ""), el("span",{}, T[t][l]), el("span",{class:"pts "+(p>=60?"st passed":"st locked")}, `${v.ok}/${v.n}`)));
  });
  app.append(ul);
  const fails = quiz.items.map((it,k)=>({q:BLOCKS[it.bi].qs[it.qi],k})).filter(x=>quiz.answers[x.k]!==x.q.a);
  if(fails.length){
    app.append(el("h2",{},"Repasa los fallos"));
    const rv = el("ul",{class:"review"});
    fails.forEach(({q})=>rv.append(el("li",{}, q.q[l], el("br"), el("span",{class:"ans"}, q.o[l][q.a]), el("div",{class:"hint",style:"margin-top:4px"}, q.e[l]))));
    app.append(rv);
  }
  app.append(el("div",{style:"display:grid;gap:10px;margin-top:24px"},
    el("button",{class:"btn",type:"button",onclick:startExam},"Repetir el examen final"),
    el("button",{class:"btn ghost",type:"button",onclick:()=>{ state.view="home"; render(); }},"Volver a mi ruta")));
}

render();
if(state.alias) pushScore();
</script>
